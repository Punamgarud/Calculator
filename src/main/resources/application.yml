spring:
  application:
    name: resource-management-system
  
  datasource:
    url: jdbc:mysql://localhost:3306/resource_management_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

  security:
    user:
      name: admin
      password: admin123
      roles: ADMIN

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    com.techmahindra: DEBUG
    org.springframework.security: DEBUG